[project]
name = "values-checker"
version = "0.1.0"
description = "Checks a VALUES.md package against the values.md standard, version 0.1."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["values_checker"]
